<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sapporo Checklist — Moved</title>
  <!-- Old path → new short URL -->
  <meta http-equiv="refresh" content="0;url=https://mohdizzudin.github.io/trip/sapporo/checklist">
  <link rel="canonical" href="https://mohdizzudin.github.io/trip/sapporo/checklist">
  <style>
    :root { --bg: #f4f7f9; --primary: #184c78; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--primary); padding: 24px; text-align: center;
    }
    .card {
      background: #fff; border-radius: 14px; padding: 28px 22px; max-width: 360px; width: 100%;
      box-shadow: 0 8px 24px rgba(24,76,120,0.12);
    }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 18px; font-size: 13px; color: #5d6d7e; line-height: 1.45; }
    a.btn {
      display: inline-block; background: var(--primary); color: #fff; text-decoration: none;
      font-weight: 800; font-size: 14px; padding: 12px 18px; border-radius: 10px;
    }
  </style>
  <script>
    (function () {
      var NEXT = "https://mohdizzudin.github.io/trip/sapporo/checklist";
      try { location.replace(NEXT); } catch (e) { location.href = NEXT; }
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Checklist moved</h1>
    <p>Redirecting to the new short URL…</p>
    <a class="btn" href="https://mohdizzudin.github.io/trip/sapporo/checklist">Open checklist</a>
  </div>
</body>
</html>
